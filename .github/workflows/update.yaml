name: Update catalogs and publish Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      refresh_catalogs:
        description: Refresh AniList data before publishing (the daily schedule always refreshes)
        type: boolean
        default: false

concurrency:
  group: anime-catalog-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PAGINATION_PAGE_SIZE: ${{ vars.PAGINATION_PAGE_SIZE || '20' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run offline tests and type checks
        run: npm run test:offline
      - name: Refresh source catalogs
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_catalogs)
        run: npm start
      - name: Build paginated site
        run: npm run build:pages
      - name: Verify every published catalog and filter
        run: npm run verify:pages
      - name: Commit refreshed source data
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_catalogs)
        shell: bash
        run: |
          git add manifest.json catalog
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update anime season data'
            git push origin HEAD:main
          fi
      - name: Upload complete Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@v4
